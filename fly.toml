app = "wordkeep-marcfs31"
primary_region = "iad"

[build]

[env]
  NODE_ENV = "production"
  PORT = "3001"
  HOST = "0.0.0.0"
  WORDKEEP_DB = "/data/wordkeep.db"
  CLIENT_DIST = "/app/client/dist"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 50
    soft_limit = 25

[[http_service.checks]]
  interval = "15s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/api/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[mounts]
  source = "wordkeep_data"
  destination = "/data"
